{% comment %}
  Determine TOC state and return it through variable "enable_toc"
{% endcomment %}

{% assign enable_toc = false %}
{% if site.toc and page.toc %}
  {% assign toc_content = include.content | default: page.content %}
  {% if toc_content contains '<h2' or toc_content contains '<h3' %}
    {% assign enable_toc = true %}
  {% endif %}
{% endif %}
